<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Page not found — CalmResume</title>

    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f2eb; color: #171a18; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; }
      main { width: min(100%, 42rem); border-top: 1px solid #cdd1c8; padding-top: 2rem; }
      .wordmark { color: #49695a; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 2rem 0 1rem; font-size: clamp(2.5rem, 9vw, 5.5rem); font-weight: 500; letter-spacing: -.05em; line-height: .95; }
      p { max-width: 34rem; color: #555c57; line-height: 1.7; }
      a { color: #243b32; text-underline-offset: .25em; }
      a:focus-visible { outline: 3px solid #49695a; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">CalmResume</p>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or may have moved.</p>
